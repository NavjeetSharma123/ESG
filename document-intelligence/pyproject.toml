[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sustanica-document-intelligence"
version = "0.1.0"
description = "Deterministic, evidence-linked ESG document extraction service"
requires-python = ">=3.11"
dependencies = [
  "docling>=2.0,<3",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9",
  "psycopg[binary,pool]>=3.1,<4",
  "pydantic-settings>=2.2,<3",
  "PyJWT[crypto]>=2.8,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

